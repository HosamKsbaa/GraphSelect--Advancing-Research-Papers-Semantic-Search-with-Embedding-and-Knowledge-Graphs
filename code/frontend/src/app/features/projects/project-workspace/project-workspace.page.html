<div class="workspace-layout">
  <!-- API Key Alert Banner -->
  <div *ngIf="!hasApiKey" class="alert-banner warning">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span>
      <strong>Configuration Missing:</strong> Gemini API key is not configured. Please add it in 
      <a routerLink="/settings">Settings</a> to use LLM-powered features.
    </span>
  </div>

  <nav class="workspace-nav">
    <div class="nav-links">
      <a [routerLink]="['/projects', projectId, 'research']" routerLinkActive="active" class="tab-link">Research</a>
      <a [routerLink]="['/projects', projectId, 'analysis']" routerLinkActive="active" class="tab-link">Analysis</a>
      <a [routerLink]="['/projects', projectId, 'planning']" routerLinkActive="active" class="tab-link">Planning</a>
      <a [routerLink]="['/projects', projectId, 'writing']" routerLinkActive="active" class="tab-link">Writing</a>
      <a [routerLink]="['/projects', projectId, 'export']" routerLinkActive="active" class="tab-link">Export</a>
    </div>
    <div class="nav-actions" style="margin-left: auto; padding-right: 1.5rem; position: relative;">
      <button class="btn-secondary" (click)="toggleFolderPopover()" title="Get Project Folder Path">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.5rem; vertical-align: middle;">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        Open Folder
      </button>

      <!-- Glassmorphic Path Popover -->
      <div *ngIf="showFolderPopover" class="folder-popover glass animate-fade-in">
        <div class="popover-header">
          <span class="popover-title">Project Folder Path</span>
          <button class="btn-close" (click)="showFolderPopover = false" title="Close">✕</button>
        </div>
        <div class="popover-body">
          <div *ngIf="loadingPath" class="loading-container">
            <span class="loading-text">Fetching path...</span>
          </div>
          <div *ngIf="!loadingPath" class="path-input-group">
            <input type="text" readonly [value]="projectPath" class="path-input" #pathInput />
            <button class="btn-copy" (click)="copyToClipboard(projectPath)" [disabled]="!projectPath" title="Copy to clipboard">
              <svg *ngIf="!copied" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <svg *ngIf="copied" class="copied-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="workspace-content">
    <router-outlet></router-outlet>
  </div>
</div>
