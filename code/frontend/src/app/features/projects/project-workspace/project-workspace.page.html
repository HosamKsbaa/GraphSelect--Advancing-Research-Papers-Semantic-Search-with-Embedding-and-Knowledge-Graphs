<div class="workspace-layout">
  <!-- Workspace Credentials Alert Banner -->
  <div 
    *ngIf="!hasApiKey()" 
    class="workspace-banner alert-banner warning header-alert animate-fade-in"
    role="alert"
  >
    <div class="banner-content">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>
        <strong>Configuration Missing:</strong> LLM provider credentials are not configured. Configure Google AI Studio or Vertex AI to unlock AI research synthesis, drafting, and chat.
      </span>
    </div>
    <div class="banner-actions">
      <button 
        type="button" 
        class="btn btn-warning btn-xs" 
        data-testid="workspace-configure-credentials-btn" 
        (click)="authModalService.open()"
      >
        🔑 Configure Credentials
      </button>
      <a routerLink="/settings" class="settings-link">Settings</a>
    </div>
  </div>

  <nav class="workspace-nav" aria-label="Project Workspace">
    <div class="nav-links" role="tablist">
      <a [routerLink]="['/projects', projectId, 'research']" routerLinkActive="active" role="tab" class="tab-link" (click)="showFolderPopover = false">Research</a>
      <a [routerLink]="['/projects', projectId, 'analysis']" routerLinkActive="active" role="tab" class="tab-link" (click)="showFolderPopover = false">Analysis</a>
      <a [routerLink]="['/projects', projectId, 'planning']" routerLinkActive="active" role="tab" class="tab-link" (click)="showFolderPopover = false">Planning</a>
      <a [routerLink]="['/projects', projectId, 'writing']" routerLinkActive="active" role="tab" class="tab-link" (click)="showFolderPopover = false">Writing</a>
      <a [routerLink]="['/projects', projectId, 'chat']" routerLinkActive="active" role="tab" class="tab-link" (click)="showFolderPopover = false">Chat</a>
      <a [routerLink]="['/projects', projectId, 'export']" routerLinkActive="active" role="tab" class="tab-link" (click)="showFolderPopover = false">Export</a>
    </div>
    <div class="nav-actions" style="margin-left: auto; padding-right: 1.5rem; position: relative;">
      <button class="btn-secondary" (click)="toggleFolderPopover()" title="Get Project Folder Path">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.5rem; vertical-align: middle;">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        Open Folder
      </button>

      <!-- Glassmorphic Path Popover -->
      <div *ngIf="showFolderPopover" class="folder-popover glass animate-fade-in">
        <div class="popover-header">
          <span class="popover-title">Project Folder Path</span>
          <button class="btn-close" (click)="showFolderPopover = false" title="Close">✕</button>
        </div>
        <div class="popover-body">
          <div *ngIf="loadingPath" class="loading-container">
            <span class="loading-text">Fetching path...</span>
          </div>
          <div *ngIf="!loadingPath" class="path-input-group">
            <input type="text" readonly [value]="projectPath" class="path-input" #pathInput />
            <button class="btn-copy" (click)="copyToClipboard(projectPath)" [disabled]="!projectPath" title="Copy to clipboard">
              <svg *ngIf="!copied" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <svg *ngIf="copied" class="copied-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="workspace-content">
    <router-outlet></router-outlet>
  </div>
</div>
