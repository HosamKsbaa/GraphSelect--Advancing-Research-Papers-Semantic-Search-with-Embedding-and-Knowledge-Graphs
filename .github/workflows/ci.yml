name: CI — Test & Lint

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: code/backend/requirements.txt

      - name: Install Dependencies
        run: pip install -r code/backend/requirements.txt

      - name: Run Backend Tests
        run: PYTHONPATH=code/backend pytest code/backend/tests/ -v --tb=short

      - name: Run Frontend Tests
        run: node --test code/frontend/tests/*.test.mjs
